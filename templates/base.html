<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="origin" />
    <title>{% block title %}Hacker News{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', filename='images/y18.svg') }}"
    />
  </head>
  <body>
    <script>
      // Translation functionality - moved to main DOMContentLoaded

      function checkForDynamicTranslation() {
        // Check if there are any ongoing translations
        fetch("/api/translation-status")
          .then((response) => response.json())
          .then((data) => {
            if (
              data.success &&
              data.translated_count > 0 &&
              data.progress < 100
            ) {
              // There are ongoing translations, start dynamic updates
              startDynamicTranslation();
            }
          })
          .catch((error) => {
            console.error("Dynamic translation check error:", error);
          });
      }

      function startDynamicTranslation() {
        let checkCount = 0;
        const maxChecks = 60; // Check for up to 60 times (60 seconds)

        const checkInterval = setInterval(() => {
          updateTitlesWithTranslations();
          checkCount++;

          // Check translation status
          fetch("/api/translation-status")
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                const translateBtn = document.getElementById("translateBtn");
                if (translateBtn) {
                  if (data.progress === 100) {
                    translateBtn.textContent = "[显示原文]";
                    translateBtn.disabled = false;
                    translateBtn.onclick = () => location.reload();
                    clearInterval(checkInterval);
                  } else {
                    translateBtn.textContent = `[翻译进度: ${data.progress}%]`;
                  }
                }

                if (checkCount >= maxChecks) {
                  clearInterval(checkInterval);
                }
              }
            })
            .catch((error) => {
              console.error("Progress check error:", error);
              checkCount++;
              if (checkCount >= maxChecks) {
                clearInterval(checkInterval);
              }
            });
        }, 500); // Check every 500ms for faster updates
      }

      function updateTitlesWithTranslations() {
        fetch("/api/translations")
          .then((response) => response.json())
          .then((data) => {
            if (data.success && data.translations) {
              // Update each story title with translation
              Object.keys(data.translations).forEach((storyId) => {
                const translation = data.translations[storyId];
                const storyRow = document.getElementById(storyId);

                if (storyRow) {
                  const titleLink = storyRow.querySelector(".titleline a");
                  if (
                    titleLink &&
                    titleLink.textContent.trim() === translation.original_title
                  ) {
                    titleLink.textContent = translation.translated_title;
                    titleLink.style.color = "#1a4480"; // Deeper blue color for translated titles
                    titleLink.setAttribute("data-translated", "true");
                  }
                }
              });

              console.log(
                `Updated ${Object.keys(data.translations).length} translations`
              );
            }
          })
          .catch((error) => {
            console.error("Translation update error:", error);
          });
      }

      function checkTranslationProgress() {
        // Only check once, no auto-refresh to avoid infinite loops
        fetch("/api/translation-status")
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              console.log(
                `Translation status: ${data.progress}% (${data.translated_count}/${data.total_stories})`
              );

              // Add a subtle progress indicator if not 100%
              if (data.progress < 100) {
                const progressInfo = document.createElement("div");
                progressInfo.style.cssText =
                  "position: fixed; top: 10px; right: 10px; background: #f0f0f0; padding: 5px 10px; border-radius: 3px; font-size: 10pt; color: #666; z-index: 1000;";
                progressInfo.textContent = `翻译进度: ${data.progress}%`;
                document.body.appendChild(progressInfo);

                // Remove progress indicator after 5 seconds
                setTimeout(() => {
                  if (progressInfo.parentNode) {
                    progressInfo.parentNode.removeChild(progressInfo);
                  }
                }, 5000);
              }
            }
          })
          .catch((error) => {
            console.error("Progress check error:", error);
          });
      }

      function initializeColorPicker() {
        const colorPicker = document.getElementById("colorPicker");
        const currentColorSpan = document.getElementById("currentColor");
        const resetColorBtn = document.getElementById("resetColorBtn");

        // Load saved color from localStorage
        const savedColor = localStorage.getItem("titleColor");
        if (savedColor) {
          colorPicker.value = savedColor;
          currentColorSpan.textContent = savedColor;
          applyColorToTitles(savedColor);
        }

        // Handle color picker change
        if (colorPicker) {
          colorPicker.addEventListener("change", function () {
            const selectedColor = this.value;
            currentColorSpan.textContent = selectedColor;

            // Apply color to all titles
            applyColorToTitles(selectedColor);

            // Save to localStorage
            localStorage.setItem("titleColor", selectedColor);

            console.log("Color changed to:", selectedColor);
          });
        }

        // Handle reset button
        if (resetColorBtn) {
          resetColorBtn.addEventListener("click", function () {
            const defaultColor = "#1a4480";
            colorPicker.value = defaultColor;
            currentColorSpan.textContent = defaultColor;
            applyColorToTitles(defaultColor);
            localStorage.setItem("titleColor", defaultColor);
            console.log("Color reset to default:", defaultColor);
          });
        }
      }

      function applyColorToTitles(color) {
        // Apply color to all title links
        const titleLinks = document.querySelectorAll(".titleline a");
        titleLinks.forEach((link) => {
          link.style.color = color;
        });

        // Also update the dynamic translation color
        const style = document.createElement("style");
        style.id = "dynamic-title-color";
        style.textContent = `.titleline a { color: ${color} !important; }`;

        // Remove existing dynamic style if it exists
        const existingStyle = document.getElementById("dynamic-title-color");
        if (existingStyle) {
          existingStyle.remove();
        }

        document.head.appendChild(style);
      }

      // Infinite scroll functionality
      let currentPage = 1;
      let isLoading = false;
      let hasMoreStories = true;

      function initializeInfiniteScroll() {
        // Only initialize if we're on the homepage AND user explicitly enables it
        if (window.location.pathname !== "/") return;

        // Don't auto-enable infinite scroll - let user choose
        console.log("Infinite scroll available (not auto-enabled)");
      }

      function enableInfiniteScroll() {
        // Only enable when user clicks the button
        if (window.location.pathname !== "/") return;

        window.addEventListener("scroll", handleScroll);
        console.log("Infinite scroll enabled by user");

        // Update button text
        const scrollBtn = document.getElementById("enableScrollBtn");
        if (scrollBtn) {
          scrollBtn.textContent = "无限滚动已启用";
          scrollBtn.disabled = true;
          scrollBtn.style.background = "#28a745";
        }
      }

      function handleScroll() {
        if (isLoading || !hasMoreStories) return;

        const scrollTop =
          window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const documentHeight = document.documentElement.scrollHeight;

        // Load more when user is 200px from bottom
        if (scrollTop + windowHeight >= documentHeight - 200) {
          loadMoreStories();
        }
      }

      function loadMoreStories() {
        if (isLoading || !hasMoreStories) return;

        isLoading = true;
        currentPage++;

        // Show loading indicator
        showLoadingIndicator();

        fetch(`/api/stories/paginated?page=${currentPage}&per_page=10`)
          .then((response) => response.json())
          .then((data) => {
            if (data.success && data.stories.length > 0) {
              appendStoriesToPage(data.stories);

              // Update pagination info
              const pagination = data.pagination;
              hasMoreStories = pagination.has_next;

              console.log(
                `Loaded page ${currentPage}: ${data.stories.length} stories`
              );
              console.log(`Has more: ${hasMoreStories}`);
            } else {
              hasMoreStories = false;
              console.log("No more stories to load");
            }
          })
          .catch((error) => {
            console.error("Error loading more stories:", error);
            hasMoreStories = false;
          })
          .finally(() => {
            isLoading = false;
            hideLoadingIndicator();
          });
      }

      function appendStoriesToPage(stories) {
        const storiesTable = document.querySelector("#hnmain table tbody");
        if (!storiesTable) return;

        stories.forEach((story) => {
          // Create story row
          const storyRow = createStoryRow(story);
          const subtextRow = createSubtextRow(story);
          const spacerRow = createSpacerRow();

          storiesTable.appendChild(storyRow);
          storiesTable.appendChild(subtextRow);
          storiesTable.appendChild(spacerRow);
        });

        // Apply current color theme to new stories
        const savedColor = localStorage.getItem("titleColor") || "#1a4480";
        applyColorToTitles(savedColor);
      }

      function createStoryRow(story) {
        const row = document.createElement("tr");
        row.className = "athing submission";
        row.id = story.id;

        row.innerHTML = `
          <td align="right" valign="top" class="title">
            <span class="rank">${story.rank}.</span>
          </td>
          <td valign="top" class="votelinks">
            <center>
              <div class="votearrow" title="upvote"></div>
            </center>
          </td>
          <td class="title">
            <span class="titleline">
              ${
                story.is_external
                  ? `<a href="${story.url}" target="_blank" rel="noopener">${story.title}</a>`
                  : `<a href="${story.story_link}">${story.title}</a>`
              }
              ${
                story.domain
                  ? `<span class="sitebit comhead">(<span class="sitestr">${story.domain}</span>)</span>`
                  : ""
              }
            </span>
          </td>
        `;

        return row;
      }

      function createSubtextRow(story) {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td colspan="2"></td>
          <td class="subtext">
            <span class="subline">
              ${
                story.points > 0
                  ? `<span class="score">${story.points} points</span> by `
                  : ""
              }
              <a href="${story.user_link}" class="hnuser">${story.author}</a>
              ${
                story.time_ago
                  ? `<span class="age"><a href="${story.comment_link}">${story.time_ago}</a></span>`
                  : ""
              } |
              <a href="${story.comment_link}">${story.comment_text}</a>
            </span>
          </td>
        `;

        return row;
      }

      function createSpacerRow() {
        const row = document.createElement("tr");
        row.className = "spacer";
        row.style.height = "5px";
        return row;
      }

      function showLoadingIndicator() {
        let indicator = document.getElementById("loading-indicator");
        if (!indicator) {
          indicator = document.createElement("div");
          indicator.id = "loading-indicator";
          indicator.style.cssText = `
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
          `;
          indicator.textContent = "Loading more stories...";

          // Insert after the main table
          const mainTable = document.getElementById("hnmain");
          if (mainTable && mainTable.parentNode) {
            mainTable.parentNode.insertBefore(indicator, mainTable.nextSibling);
          }
        }
        indicator.style.display = "block";
      }

      function hideLoadingIndicator() {
        const indicator = document.getElementById("loading-indicator");
        if (indicator) {
          indicator.style.display = "none";
        }
      }

      function initializeCrawlButton() {
        const crawlBtn = document.getElementById("crawlBtn");

        if (crawlBtn) {
          crawlBtn.addEventListener("click", function () {
            // Show loading state
            crawlBtn.textContent = "爬取中...";
            crawlBtn.disabled = true;
            crawlBtn.style.background = "#6c757d";

            // Call crawl API
            fetch("/api/crawl?type=top&limit=30")
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  // Show success message
                  crawlBtn.textContent = `✓ 已爬取${data.stories_count}条`;
                  crawlBtn.style.background = "#28a745";

                  // Ask user if they want to load the new data
                  setTimeout(() => {
                    if (
                      confirm(
                        `成功爬取了${data.stories_count}条最新数据！\n文件：${data.filename}\n\n是否立即加载新数据？`
                      )
                    ) {
                      loadCrawledData(data.filename);
                    } else {
                      // Reset button
                      crawlBtn.textContent = "爬取最新数据";
                      crawlBtn.disabled = false;
                    }
                  }, 1000);
                } else {
                  alert("爬取失败: " + data.error);
                  crawlBtn.textContent = "爬取失败";
                  crawlBtn.style.background = "#dc3545";

                  // Reset button after 2 seconds
                  setTimeout(() => {
                    crawlBtn.textContent = "爬取最新数据";
                    crawlBtn.style.background = "#28a745";
                    crawlBtn.disabled = false;
                  }, 2000);
                }
              })
              .catch((error) => {
                console.error("Crawl error:", error);
                alert("爬取失败，请稍后重试");
                crawlBtn.textContent = "爬取失败";
                crawlBtn.style.background = "#dc3545";

                // Reset button after 2 seconds
                setTimeout(() => {
                  crawlBtn.textContent = "爬取最新数据";
                  crawlBtn.style.background = "#28a745";
                  crawlBtn.disabled = false;
                }, 2000);
              });
          });
        }
      }

      function loadCrawledData(filename) {
        const crawlBtn = document.getElementById("crawlBtn");

        // Show loading state
        crawlBtn.textContent = "加载数据中...";
        crawlBtn.style.background = "#6c757d";

        fetch(`/api/load-json?filename=${filename}`)
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              // Success - reload page to show new data
              crawlBtn.textContent = "✓ 数据已更新";
              crawlBtn.style.background = "#28a745";

              setTimeout(() => {
                window.location.reload();
              }, 1000);
            } else {
              alert("加载数据失败: " + data.error);
              crawlBtn.textContent = "加载失败";
              crawlBtn.style.background = "#dc3545";

              // Reset button after 2 seconds
              setTimeout(() => {
                crawlBtn.textContent = "爬取最新数据";
                crawlBtn.style.background = "#28a745";
                crawlBtn.disabled = false;
              }, 2000);
            }
          })
          .catch((error) => {
            console.error("Load data error:", error);
            alert("加载数据失败，请稍后重试");
            crawlBtn.textContent = "加载失败";
            crawlBtn.style.background = "#dc3545";

            // Reset button after 2 seconds
            setTimeout(() => {
              crawlBtn.textContent = "爬取最新数据";
              crawlBtn.style.background = "#28a745";
              crawlBtn.disabled = false;
            }, 2000);
          });
      }

      // Initialize infinite scroll when DOM is ready
      document.addEventListener("DOMContentLoaded", function () {
        const translateBtn = document.getElementById("translateBtn");
        if (translateBtn) {
          translateBtn.addEventListener("click", function () {
            // Show loading state
            translateBtn.textContent = "[翻译前3条...]";
            translateBtn.disabled = true;

            // Call translation API
            fetch("/api/translate")
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  if (data.already_completed) {
                    // All stories already translated, update titles immediately
                    updateTitlesWithTranslations();
                    translateBtn.textContent = "[显示原文]";
                    translateBtn.onclick = () => location.reload();
                  } else {
                    // Show progress message
                    translateBtn.textContent = `[已翻译${data.priority_count}条，其余后台处理中...]`;

                    // Start dynamic translation updates
                    startDynamicTranslation();
                  }
                } else {
                  alert("翻译失败: " + data.error);
                  translateBtn.textContent = "[翻译为中文]";
                  translateBtn.disabled = false;
                }
              })
              .catch((error) => {
                console.error("Translation error:", error);
                alert("翻译失败，请稍后重试");
                translateBtn.textContent = "[翻译为中文]";
                translateBtn.disabled = false;
              });
          });
        }

        // Check for background translation progress if on translated page
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("translate") === "true") {
          updateTitlesWithTranslations();
        } else {
          // Check if we should start dynamic translation on normal page
          checkForDynamicTranslation();
        }

        // Initialize color picker functionality
        initializeColorPicker();

        // Initialize crawl button functionality
        initializeCrawlButton();

        // Initialize infinite scroll
        initializeInfiniteScroll();
      });
    </script>
    <center>
      <table
        id="hnmain"
        border="0"
        cellpadding="0"
        cellspacing="0"
        width="85%"
        bgcolor="#f6f6ef"
      >
        <tbody>
          <!-- Header row -->
          <tr>
            <td bgcolor="#ff6600">
              <table
                border="0"
                cellpadding="0"
                cellspacing="0"
                width="100%"
                style="padding: 2px"
              >
                <tbody>
                  <tr>
                    <td style="width: 18px; padding-right: 4px">
                      <a href="{{ url_for('index') }}">
                        <img
                          src="{{ url_for('static', filename='images/y18.svg') }}"
                          width="18"
                          height="18"
                          style="border: 1px white solid; display: block"
                          alt="Y Combinator"
                        />
                      </a>
                    </td>
                    <td style="line-height: 12pt; height: 10px">
                      <span class="pagetop">
                        <b class="hnname">
                          <a href="{{ url_for('index') }}">Hacker News</a>
                        </b>
                        <a href="{{ url_for('new') }}">new</a> |
                        <a href="{{ url_for('past') }}">past</a> |
                        <a href="{{ url_for('comments') }}">comments</a> |
                        <a href="{{ url_for('ask') }}">ask</a> |
                        <a href="{{ url_for('show') }}">show</a> |
                        <a href="{{ url_for('jobs') }}">jobs</a> |
                        <a href="{{ url_for('submit') }}" rel="nofollow"
                          >submit</a
                        >
                      </span>
                    </td>
                    <td style="text-align: right; padding-right: 4px">
                      <span class="pagetop">
                        <a href="{{ url_for('login') }}">login</a>
                      </span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>

          <!-- Spacer row -->
          <tr style="height: 10px"></tr>

          <!-- Content row with two columns -->
          <tr>
            <td>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="70%" valign="top" style="padding-right: 20px">
                    <!-- Left column: scrollable content -->
                    <div style="overflow-y: auto; max-height: 100vh">
                      {% block content %}{% endblock %}
                    </div>
                  </td>
                  <td width="30%" valign="top">
                    <!-- Right column: fixed test area -->
                    <div
                      id="testArea"
                      style="
                        background-color: #f9f9f9;
                        padding: 15px;
                        border-radius: 5px;
                        border: 1px solid #e0e0e0;
                        position: sticky;
                        top: 20px;
                      "
                    >
                      <h3 style="margin-top: 0; font-size: 12pt; color: #333">
                        测试区域
                      </h3>

                      <!-- Row 1: Translation Button -->
                      <div style="margin-bottom: 15px">
                        <button
                          id="translateBtn"
                          style="
                            background: #ff6600;
                            color: white;
                            border: none;
                            padding: 8px 15px;
                            border-radius: 3px;
                            cursor: pointer;
                            font-size: 10pt;
                            width: 100%;
                          "
                        >
                          翻译为中文
                        </button>
                      </div>

                      <!-- Row 2: Color Picker -->
                      <div style="margin-bottom: 15px">
                        <label
                          for="colorPicker"
                          style="
                            display: block;
                            margin-bottom: 5px;
                            font-size: 10pt;
                            color: #333;
                          "
                        >
                          标题颜色选择器:
                        </label>
                        <input
                          type="color"
                          id="colorPicker"
                          value="#1a4480"
                          style="
                            width: 100%;
                            height: 40px;
                            border: 1px solid #ccc;
                            border-radius: 3px;
                            cursor: pointer;
                          "
                        />
                        <div
                          style="margin-top: 5px; font-size: 9pt; color: #666"
                        >
                          当前颜色: <span id="currentColor">#1a4480</span>
                        </div>
                      </div>

                      <!-- Row 3: Crawl Data Button -->
                      <div style="margin-bottom: 15px">
                        <button
                          id="crawlBtn"
                          style="
                            background: #28a745;
                            color: white;
                            border: none;
                            padding: 8px 15px;
                            border-radius: 3px;
                            cursor: pointer;
                            font-size: 10pt;
                            width: 100%;
                          "
                        >
                          爬取最新数据
                        </button>
                      </div>

                      <!-- Row 4: Enable Infinite Scroll Button -->
                      <div style="margin-bottom: 15px">
                        <button
                          id="enableScrollBtn"
                          style="
                            background: #007bff;
                            color: white;
                            border: none;
                            padding: 8px 15px;
                            border-radius: 3px;
                            cursor: pointer;
                            font-size: 10pt;
                            width: 100%;
                          "
                          onclick="enableInfiniteScroll()"
                        >
                          启用无限滚动
                        </button>
                      </div>

                      <!-- Row 5: Reset Button -->
                      <div>
                        <button
                          id="resetColorBtn"
                          style="
                            background: #666;
                            color: white;
                            border: none;
                            padding: 6px 12px;
                            border-radius: 3px;
                            cursor: pointer;
                            font-size: 9pt;
                            width: 100%;
                          "
                        >
                          重置为默认颜色
                        </button>
                      </div>
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer spacer -->
          <tr style="height: 10px"></tr>

          <!-- Footer -->
          <tr>
            <td>
              <center>
                <span class="yclinks">
                  <a href="https://news.ycombinator.com/newsguidelines.html"
                    >Guidelines</a
                  >
                  |
                  <a href="https://news.ycombinator.com/newsfaq.html">FAQ</a> |
                  <a href="https://news.ycombinator.com/lists">Lists</a> |
                  <a href="https://github.com/HackerNews/API">API</a> |
                  <a href="https://news.ycombinator.com/security.html"
                    >Security</a
                  >
                  | <a href="https://www.ycombinator.com/legal/">Legal</a> |
                  <a href="https://www.ycombinator.com/apply/">Apply to YC</a> |
                  <a href="mailto:hn@ycombinator.com">Contact</a>
                </span>
              </center>
            </td>
          </tr>
        </tbody>
      </table>
    </center>
  </body>
</html>
